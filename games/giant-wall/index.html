<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>巨人壁ゲーム</title>
<style>
  :root{
    --bg:#222; --fg:#eee; --panel:#333; --line:#555;
    --front:#888; --back:#444;
    --crack:rgba(25,15,10,.6);    /* ひびの色 */
    --sand1:#e2d5bf; --sand2:#c8b79c; --sand3:#a8957a;   /* 降ってくる砂の色（粒ごとにどれか） */
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden}
  body{
    background:var(--bg); color:var(--fg);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
    touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  #app{
    position:relative;
    width:100%;max-width:420px;height:100vh;height:100dvh;margin:0 auto;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #top{display:flex;justify-content:flex-end;gap:8px;padding:8px 8px 0}
  #bar{display:flex;gap:8px;padding:8px}
  .pick,.btn{position:relative;min-height:44px;display:flex;align-items:center;justify-content:center;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;cursor:pointer;padding:0 4px}
  .pick{flex:1;min-width:0;white-space:nowrap}
  .icon{width:44px;flex:none;padding:0}
  .icon svg{width:24px;height:24px;display:block}
  .btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
  /* カメラ：オンのときは反転表示し、どちらの写真をカメラにしているか（壁・中）を添える */
  #cam{gap:2px;width:auto;min-width:44px;padding:0 8px}
  #cam[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
  #cam-label{font-size:13px}
  #cam-label:empty{display:none}
  #cam-video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  /* 音：オンとオフでアイコンを切り替える */
  #sound .off{display:none}
  #sound[aria-pressed="false"] .on{display:none}
  #sound[aria-pressed="false"] .off{display:block}
  .hidden{display:none !important}
  /* 共有される内容の画面（共有シートが出ない環境用） */
  #share-view{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
  #share-view .panel{width:min(90%,340px);max-height:94%;overflow:auto;touch-action:pan-y;background:var(--panel);border-radius:10px;padding:12px}
  #share-img{display:block;width:100%;height:auto}
  #share-text{white-space:pre-wrap;word-break:break-all;-webkit-user-select:text;user-select:text;font-size:14px}
  #share-close{width:100%}
  /* カメラを使う前の確認 */
  #cam-view{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5)}
  #cam-view .panel{width:min(90%,340px);background:var(--panel);border-radius:10px;padding:16px}
  #cam-title{margin:0 0 8px;font-size:16px;font-weight:bold}
  #cam-text{margin:0 0 16px;font-size:14px;line-height:1.6}
  #cam-actions{display:flex;gap:8px}
  #cam-actions .btn{flex:1}
  #cam-allow{background:var(--fg);color:var(--bg)}
  /* inputは消さずに見えなくするだけ（display:noneにすると環境によってファイル選択が効かない） */
  .pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
  .pick:focus-within{outline:2px solid var(--fg)}
  #stage{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
</style>

<body>
<div id="app">
  <div id="top">
    <button id="cam" class="btn icon" type="button" aria-pressed="false" aria-label="カメラ：オフ">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>
      <span id="cam-label" aria-hidden="true"></span>
    </button>
    <button id="sound" class="btn icon" type="button" aria-pressed="true" aria-label="効果音">
      <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6"/></svg>
    </button>
  </div>
  <div id="stage">
    <canvas id="cv" role="img" aria-label="壁。タップした所がひび割れて崩れ、中の写真が見えます"></canvas>
  </div>
  <div id="bar">
    <label class="pick" id="pick0"><span id="pickText0">壁の写真</span><input id="file0" type="file" accept="image/*"></label>
    <label class="pick" id="pick1"><span id="pickText1">中の写真</span><input id="file1" type="file" accept="image/*"></label>
    <button id="share" class="btn icon" type="button" aria-label="共有">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M8 10H6a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-9a1 1 0 0 0-1-1h-2"/></svg>
    </button>
  </div>
  <video id="cam-video" playsinline muted autoplay></video>
  <div id="cam-view" class="hidden" role="dialog" aria-modal="true" aria-labelledby="cam-title" aria-describedby="cam-text">
    <div class="panel">
      <p id="cam-title">カメラを使います</p>
      <p id="cam-text">スマホの外カメラ（背面）と内カメラ（画面側）を使います。壁の写真には外カメラ、中の写真には内カメラの映像が入ります。</p>
      <div id="cam-actions">
        <button id="cam-close" class="btn" type="button">閉じる</button>
        <button id="cam-allow" class="btn" type="button">許可</button>
      </div>
    </div>
  </div>
  <div id="share-view" class="hidden" role="dialog" aria-label="共有される内容">
    <div class="panel">
      <img id="share-img" alt="共有される画像">
      <p id="share-text"></p>
      <button id="share-close" class="btn" type="button">閉じる</button>
    </div>
  </div>
</div>
<script>
(() => {
  'use strict';

  // ---------- 定数 ----------
  // 崩れ方（タップした所にギザギザの穴が開き、穴の分の壁が破片になって落ちる）
  const HOLE_R = 34;           // 穴の大きさ（中心から縁までのおおよその距離、px）
  const HARDNESS = [2, 5];     // 壊れにくさ：同じ所をこの回数叩くと穴が開く（それまではひびが入るだけ）。叩き始めた所ごとに、この範囲（最小, 最大）からランダムに決める
  const HIT_R = 30;            // 前に叩いた所からこの距離（px）までなら、同じ所を叩いたとみなす
  const HOLE_PTS = [16, 24];   // 穴の縁の角の数（最小, 最大）。多いほど細かくギザギザになる
  const HOLE_JAG = 0.45;       // 縁のギザギザの深さ（穴の大きさに対する割合）
  const SPIKE_P = 0.2;         // 縁の角がとがって外へ飛び出す確率
  const SPIKE = 1.5;           // とがった角が飛び出す長さ（穴の大きさに対する倍率）
  const FRAG_EDGES = [2, 3];   // 破片1つが受け持つ縁の辺の数（最小, 最大）。少ないほど細かく割れる
  const FRAG_SPLIT = [0.35, 0.7];  // 破片を内側と外側に割る位置（中心からの割合、最小, 最大）
  const FRAG_MIN_FILL = 0.12;  // 破片の範囲のうち、壁が残っている割合がこれより少ない破片は落とさない（前に開いた穴にかかった破片）
  const RIM_W = 1.5;           // 穴の縁の、割れて暗くなった所の幅（壁の側、px）
  const RIM_ALPHA = 0.35;      // 同じく暗さ（0〜1）
  // ひび
  const CRACK_N = [2, 3];      // 1回叩くごとに伸びるひびの本数（最小, 最大）
  const CRACK_LEN = [40, 110]; // ひび1本の長さ（叩いた所から、px、最小, 最大）
  const CRACK_STEP = 7;        // ひびの折れ目の間隔（px）
  const CRACK_BEND = 0.55;     // 折れ目ごとに向きがぶれる大きさ（ラジアン）
  const CRACK_BRANCH = 0.05;   // 折れ目ごとに枝分かれする確率
  const CRACK_W = 1.8;         // ひびの付け根の太さ（px）。先へ行くほど細くなる
  // 破片の落ち方
  const GRAVITY = 2200;        // 重力（px/秒²）
  const POP = [40, 220];       // タップした所から外へはじける速さ（px/秒、最小, 最大）
  const POP_UP = 180;          // 上へはね上がる速さの最大（px/秒）
  const SPIN = 5;              // 回転の速さの最大（ラジアン/秒）
  const GROW = 0.7;            // 手前に倒れてくるように、1秒ごとにこの割合だけ大きくする
  // 壁の厚み（穴の縁に見える、壁の割れた断面）
  const THICK = 7;             // 厚み（px）。光が左上から来るので、穴の左上の縁に断面が見える
  const THICK_DIR = [0.5, 0.85];  // 断面が見える向き（右下へ）
  const THICK_DARK = 0.55;     // 断面を壁の表面よりどれだけ暗くするか（0〜1）
  // 穴の中に落ちる壁の影（縁ほど濃い、ぼかした黒いグラデーション）
  // 縁のすぐそばを濃くする狭い影と、内側まで届く広い影を重ねる [ぼかしの幅(px), 濃さ(0〜1)]
  const FADE_LAYERS = [[5, 0.9], [14, 0.85], [32, 0.7]];
  const FADE_X = 4;            // 影のずれ（px、右へ）
  const FADE_Y = 8;            // 影のずれ（px、下へ）
  // 叩いたときの壁の震え
  const SHAKE_AMP = 3;         // 震える幅（px）
  const SHAKE_TIME = 0.25;     // 震えが収まるまでの時間（秒）
  // 震えたときに上から降ってくる砂
  const SAND_N = 160;          // 1回震えるごとに降る砂粒の数（震えている間に少しずつ出る）
  const SAND_SIZE = [1.2, 2.4];  // 砂粒の大きさ（px、最小, 最大）
  const SAND_GRAVITY = 900;    // 砂粒の落ちる加速（px/秒²）
  const SAND_MAX_V = 520;      // 砂粒の落ちる速さの上限（空気で遅くなる分。px/秒）
  const SAND_ALPHA = 0.5;      // 砂粒の濃さ（0〜1）
  const SAND_EDGE = 2.5;       // 降る位置の偏り。1で全体に均等、大きいほど真ん中が少なく左右の端に集まる
  const SAND_DRIFT = 25;       // 砂粒の横へ流れる速さの最大（px/秒）

  // 効果音
  const SE_VOLUME = 0.6;       // 全体の音量
  // 共有
  const SHARE_INSTANT = 0.5;   // 共有がこの秒数より早くキャンセル扱いで終わったら、共有シートは出ていなかったとみなす

  // ---------- 準備 ----------
  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const COL = { front: css('--front'), back: css('--back'), crack: css('--crack'), sand: [css('--sand1'), css('--sand2'), css('--sand3')] };
  const rand = (a, b) => a + Math.random() * (b - a);

  let W = 0, H = 0, dpr = 1;
  const imgs = [null, null];      // 0: 壁の写真, 1: 中の写真

  // 画面の大きさで下描きしておく画像
  const mk = () => document.createElement('canvas');
  const backC = mk();     // 中の写真
  const crackC = mk();    // ひびと穴の縁（透明な重ね絵。カメラの映像の上にもそのまま重ねられるように分けて持つ）
  const srcC = mk();      // 壁の写真＋ひび（崩れる前の壁全体）
  const wallC = mk();     // 崩れた所を抜いた壁
  const shadowC = mk();   // 壁の影（壁の形を黒くしたもの）
  const fadeC = mk();     // 穴の中に落ちる壁の影
  const sideC = mk();     // 壁の割れた断面

  // 壁の状態は壁の写真の画素の座標で持つ（画面の大きさが変わってもずれないように）
  let holes = [];         // 開いた穴：縁の点の列 [[x, y], …]
  let shakeT = 0;         // 壁の震えの残り時間（秒）
  const sand = [];        // 降っている砂粒 {x, y, vx, vy, r, c}
  let sandDue = 0;        // まだ出していない砂粒の数（端数を持ち越す）
  let spots = [];         // ひびだけ入っていて、まだ穴が開いていない所 {x, y, hits, need}
  let cracks = [];        // ひび：点の列 [[x, y, 太さ(px)], …]
  const frags = [];       // 落ちている破片 {c, ox, oy, w, h, x, y, vx, vy, a, va, sc}

  // カメラ（layer：映像を入れている写真 0:壁 1:中 -1:使っていない）
  const cam = { state: 0, layer: -1, stream: null, mirror: false, token: 0 };
  const video = $('cam-video');
  const camOn = layer => cam.layer === layer && !!cam.stream && video.readyState >= 2 && !!video.videoWidth;

  // 壁の写真を画面いっぱいに収める変換（はみ出た分は切る）
  let tf = { s: 1, ox: 0, oy: 0 };
  function frontSize(){
    const im = imgs[0];
    return im ? { w: im.width, h: im.height } : { w: W, h: H };
  }
  function updateTf(){
    const { w, h } = frontSize();
    const s = Math.max(W / w, H / h);
    tf = { s, ox: (W - w * s) / 2, oy: (H - h * s) / 2 };
  }
  const toScreen = (x, y) => [x * tf.s + tf.ox, y * tf.s + tf.oy];
  const toImage = (x, y) => [(x - tf.ox) / tf.s, (y - tf.oy) / tf.s];

  // 壁を作り直す（壁の写真を変えたとき）
  function resetWall(){
    updateTf();
    holes = [];
    spots = [];
    cracks = [];
    renderCracks();
    renderSrc();
    renderMask();
  }

  // ---------- 下描き ----------
  function sizeC(c){
    c.width = Math.max(1, Math.round(W * dpr));
    c.height = Math.max(1, Math.round(H * dpr));
  }
  // 絵（写真・カメラの映像）を、範囲 (x, y, w, h) いっぱいに収まるよう拡大し、はみ出た分は切って描く
  const srcW = s => s.videoWidth || s.width, srcH = s => s.videoHeight || s.height;
  function coverInto(g, s, x, y, w, h, mirror){
    const k = Math.max(w / srcW(s), h / srcH(s)), dw = srcW(s) * k, dh = srcH(s) * k;
    g.save();
    g.beginPath(); g.rect(x, y, w, h); g.clip();
    if (mirror){ g.translate(x * 2 + w, 0); g.scale(-1, 1); }
    g.drawImage(s, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
    g.restore();
  }
  // 中の写真（カメラにしているときは、その時の映像）
  function renderBack(){
    const g = backC.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = COL.back;
    g.fillRect(0, 0, backC.width, backC.height);
    if (camOn(1)) coverInto(g, video, 0, 0, backC.width, backC.height, cam.mirror);
    else if (imgs[1]) coverInto(g, imgs[1], 0, 0, backC.width, backC.height, false);
  }

  // ひびを1本描く（先へ行くほど細く）
  function strokeCrack(g, pts){
    g.strokeStyle = COL.crack;
    g.lineCap = 'round';
    for (let i = 1; i < pts.length; i++){
      const [ax, ay] = toScreen(pts[i - 1][0], pts[i - 1][1]), [bx, by] = toScreen(pts[i][0], pts[i][1]);
      g.lineWidth = pts[i][2];
      g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke();
    }
  }
  // 穴の形をなぞる（座標は壁の写真の画素）
  function holePath(g, poly){
    g.beginPath();
    poly.forEach((p, i) => { const [x, y] = toScreen(p[0], p[1]); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.closePath();
  }
  // 穴の縁の暗い所（線の半分は穴に抜けて、外側の半分が壁に残る）
  function strokeRim(g, poly){
    holePath(g, poly);
    g.strokeStyle = `rgba(0,0,0,${RIM_ALPHA})`;
    g.lineWidth = RIM_W * 2;
    g.lineJoin = 'round';
    g.stroke();
  }
  // 今までのひびと穴の縁を描き直す
  function renderCracks(){
    const g = crackC.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, crackC.width, crackC.height);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const c of cracks) strokeCrack(g, c);
    for (const h of holes) strokeRim(g, h);
  }
  // 壁の写真（カメラにしているときは、その時の映像）＋ひびと穴の縁
  // 映像は壁の写真と同じ範囲に収めて描く（カメラを止めたときに、その時の映像を壁の写真としてそのまま残せるように）
  function renderSrc(){
    const g = srcC.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = COL.front;
    g.fillRect(0, 0, srcC.width, srcC.height);
    const { w, h } = frontSize();
    const s = camOn(0) ? video : imgs[0];
    if (s) coverInto(g, s, tf.ox * dpr, tf.oy * dpr, w * tf.s * dpr, h * tf.s * dpr, camOn(0) && cam.mirror);
    g.drawImage(crackC, 0, 0);
    renderWall();
  }
  // 穴を抜いた壁と、その断面
  function renderWall(){
    const g = wallC.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, wallC.width, wallC.height);
    g.drawImage(srcC, 0, 0);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.globalCompositeOperation = 'destination-out';
    g.fillStyle = '#000';
    for (const h of holes){ holePath(g, h); g.fill(); }
    g.globalCompositeOperation = 'source-over';
    renderSide();
  }
  // 壁の影（壁の形を黒くしたもの）と、穴の中に落ちる影（穴の形が変わったときだけ作り直す）
  function renderMask(){
    const s = shadowC.getContext('2d');
    s.globalCompositeOperation = 'source-over';
    s.clearRect(0, 0, shadowC.width, shadowC.height);
    s.drawImage(wallC, 0, 0);
    s.globalCompositeOperation = 'source-in';
    s.fillStyle = '#000';
    s.fillRect(0, 0, shadowC.width, shadowC.height);
    s.globalCompositeOperation = 'source-over';
    renderFade();
  }
  // 穴の中に落ちる壁の影：壁の黒い形を、canvasの影（shadowBlur）付きで描く。
  // 黒い形そのものは壁の裏に隠れるので、穴の中には影のぼかしだけが見える（ctx.filter のぼかしは使えない環境があるため使わない）
  function renderFade(){
    const f = fadeC.getContext('2d'), fw = fadeC.width;
    f.setTransform(1, 0, 0, 1, 0, 0);
    f.clearRect(0, 0, fw, fadeC.height);
    for (const [blur, alpha] of FADE_LAYERS){
      f.save();
      f.shadowColor = `rgba(0,0,0,${alpha})`;
      f.shadowBlur = blur * dpr;
      f.shadowOffsetX = FADE_X * dpr;
      f.shadowOffsetY = FADE_Y * dpr;
      f.drawImage(shadowC, 0, 0);
      f.restore();
    }
  }
  // 壁の割れた断面：穴を抜いた壁を少しずつずらして重ね、暗くする
  function renderSide(){
    const g = sideC.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalCompositeOperation = 'source-over';
    g.clearRect(0, 0, sideC.width, sideC.height);
    const l = Math.hypot(THICK_DIR[0], THICK_DIR[1]), dx = THICK_DIR[0] / l * dpr, dy = THICK_DIR[1] / l * dpr;
    for (let i = Math.ceil(THICK); i >= 1; i--) g.drawImage(wallC, dx * i, dy * i);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = `rgba(0,0,0,${THICK_DARK})`;
    g.fillRect(0, 0, sideC.width, sideC.height);
    g.globalCompositeOperation = 'source-over';
  }

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    if (!W || !H) return;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    for (const c of [backC, crackC, srcC, wallC, shadowC, fadeC, sideC]) sizeC(c);
    updateTf();
    renderBack();
    renderCracks();
    renderSrc();
    renderMask();
    requestDraw();
  }

  // ---------- ひび ----------
  // (x, y) から向き ang へ、ぶれながら伸びるひび（ときどき枝分かれする）。座標は画面のpx
  function growCrack(x, y, ang, len, w, depth){
    const base = ang, pts = [[x, y, w]];
    for (let d = 0; d < len;){
      ang += (Math.random() * 2 - 1) * CRACK_BEND;
      ang += (base - ang) * 0.3;   // 元の向きへ戻す力（ぐるぐる回らないように）
      const step = CRACK_STEP * rand(0.6, 1.4);
      x += Math.cos(ang) * step; y += Math.sin(ang) * step; d += step;
      const ww = Math.max(0.6, w * (1 - d / len));
      pts.push([x, y, ww]);
      if (depth < 2 && d < len * 0.8 && Math.random() < CRACK_BRANCH){
        growCrack(x, y, ang + (Math.random() < 0.5 ? -1 : 1) * rand(0.5, 1.1), (len - d) * 0.6, ww * 0.7, depth + 1);
      }
    }
    // 壁の写真の座標にして残す
    const out = pts.map(([px, py, pw]) => [...toImage(px, py), pw]);
    cracks.push(out);
    return out;
  }
  function addCracks(x, y){
    const n = Math.round(rand(CRACK_N[0], CRACK_N[1])), a0 = Math.random() * Math.PI * 2;
    const g = crackC.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const from = cracks.length;
    for (let i = 0; i < n; i++){
      const ang = a0 + i * Math.PI * 2 / n + rand(-0.35, 0.35);
      growCrack(x, y, ang, rand(CRACK_LEN[0], CRACK_LEN[1]), CRACK_W, 0);
    }
    for (let i = from; i < cracks.length; i++) strokeCrack(g, cracks[i]);
  }

  // ---------- 破片 ----------
  // 多角形を直線（点 p を通り、法線 n）で2つに切る
  function splitPoly(poly, px, py, nx, ny){
    const A = [], B = [];
    for (let i = 0; i < poly.length; i++){
      const p = poly[i], q = poly[(i + 1) % poly.length];
      const sp = (p[0] - px) * nx + (p[1] - py) * ny, sq = (q[0] - px) * nx + (q[1] - py) * ny;
      (sp >= 0 ? A : B).push(p);
      if ((sp >= 0) !== (sq >= 0)){
        const t = sp / (sp - sq), m = [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
        A.push(m); B.push(m);
      }
    }
    return [A, B];
  }
  const polyArea = poly => {
    let a = 0;
    for (let i = 0; i < poly.length; i++){ const p = poly[i], q = poly[(i + 1) % poly.length]; a += p[0] * q[1] - q[0] * p[1]; }
    return Math.abs(a) / 2;
  };
  const centroid = poly => {
    let x = 0, y = 0;
    for (const p of poly){ x += p[0]; y += p[1]; }
    return [x / poly.length, y / poly.length];
  };
  // (x, y) を中心にしたギザギザの穴の縁（画面のpx）。中心から見てどの向きにも縁が1か所だけある形にする
  function makeHole(x, y){
    const n = Math.round(rand(HOLE_PTS[0], HOLE_PTS[1])), a0 = Math.random() * Math.PI * 2, out = [];
    const R = HOLE_R;
    for (let i = 0; i < n; i++){
      const a = a0 + (i + rand(-0.35, 0.35)) * Math.PI * 2 / n;
      let r = R * (1 + rand(-HOLE_JAG, HOLE_JAG)) * (i % 2 ? 0.85 : 1.1);
      if (Math.random() < SPIKE_P) r = R * SPIKE * rand(0.85, 1.15);
      out.push([x + Math.cos(a) * r, y + Math.sin(a) * r]);
    }
    return out;
  }
  // 穴の分の壁を、中心から放射状の破片に割る（さらに内側と外側に割る）
  function shatter(x, y, hole){
    const pieces = [], n = hole.length;
    for (let i = 0; i < n;){
      const k = Math.min(n - i, Math.round(rand(FRAG_EDGES[0], FRAG_EDGES[1])));
      const wedge = [[x, y]];
      for (let j = 0; j <= k; j++) wedge.push(hole[(i + j) % n]);
      i += k;
      // 扇の真ん中の向きと直角に、中心から途中の所で割る
      const [mx, my] = centroid(wedge.slice(1));
      const d = Math.hypot(mx - x, my - y) || 1, ux = (mx - x) / d, uy = (my - y) / d;
      const t = rand(FRAG_SPLIT[0], FRAG_SPLIT[1]) * d;
      const tilt = rand(-0.5, 0.5), nx = ux * Math.cos(tilt) - uy * Math.sin(tilt), ny = ux * Math.sin(tilt) + uy * Math.cos(tilt);
      const [A, B] = splitPoly(wedge, x + ux * t, y + uy * t, nx, ny);
      for (const p of [A, B]) if (p.length >= 3 && polyArea(p) > 2) pieces.push(p);
    }
    return pieces;
  }
  // 破片の絵のうち、壁が残っている（透明でない）画素の割合
  function wallCoverage(g, w, h){
    const d = g.getImageData(0, 0, w, h).data;
    let n = 0;
    for (let i = 3; i < d.length; i += 4) if (d[i] > 128) n++;
    return n / (w * h);
  }
  // 破片1つ分の絵を切り出して、落ちる破片にする（tx, ty：タップした所）
  function spawnFrag(poly, tx, ty){
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const p of poly){ x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    const w = x1 - x0, h = y1 - y0;
    if (w < 1 || h < 1) return;
    const c = mk();
    c.width = Math.ceil(w * dpr); c.height = Math.ceil(h * dpr);
    const g = c.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, -x0 * dpr, -y0 * dpr);
    g.beginPath();
    poly.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.closePath();
    g.save();
    g.clip();
    g.drawImage(wallC, 0, 0, W, H);   // 前に開いた穴の所は抜けたまま
    // 割れた面の縁を少し暗くして、重なった破片を見分けられるようにする
    // （壁が残っている所にだけ描く。穴の所に縁の線だけが浮いて、透明な破片に見えないように）
    g.globalCompositeOperation = 'source-atop';
    g.strokeStyle = 'rgba(0,0,0,.35)';
    g.lineWidth = 1.5;
    g.stroke();
    g.restore();
    // 前に開いた穴にかかって、壁がほとんど残っていない破片は落とさない
    if (wallCoverage(g, c.width, c.height) < FRAG_MIN_FILL) return;
    const [cx, cy] = centroid(poly);
    let dx = cx - tx, dy = cy - ty;
    const l = Math.hypot(dx, dy) || 1;
    dx /= l; dy /= l;
    const sp = rand(POP[0], POP[1]);
    frags.push({
      c, ox: x0 - cx, oy: y0 - cy, w, h,
      x: cx, y: cy, vx: dx * sp, vy: dy * sp - rand(0, POP_UP),
      a: 0, va: rand(-SPIN, SPIN), sc: 1,
    });
  }

  // ---------- 崩す ----------
  function hit(x, y){
    shakeT = SHAKE_TIME;
    addCracks(x, y);
    // 同じ所を決められた回数叩くまでは、ひびが入るだけ
    let spot = null, best = HIT_R;
    for (const s of spots){
      const [sx, sy] = toScreen(s.x, s.y), d = Math.hypot(sx - x, sy - y);
      if (d <= best){ best = d; spot = s; }
    }
    if (!spot){
      const need = HARDNESS[0] + Math.floor(Math.random() * (HARDNESS[1] - HARDNESS[0] + 1));
      spot = { x: 0, y: 0, hits: 0, need };
      spots.push(spot);
    }
    [spot.x, spot.y] = toImage(x, y);   // 最後に叩いた所を中心にする
    spot.hits++;
    if (spot.hits < spot.need){
      se.crack();
      renderSrc();
      requestDraw();
      return;
    }
    spots.splice(spots.indexOf(spot), 1);
    se.crumble();
    renderSrc();
    // 穴の分の壁を破片にして落とし、穴を開ける
    const hole = makeHole(x, y);
    for (const poly of shatter(x, y, hole)) spawnFrag(poly, x, y);
    const h = hole.map(([px, py]) => toImage(px, py));
    holes.push(h);
    const g = crackC.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    strokeRim(g, h);
    renderSrc();
    renderMask();
    requestDraw();
  }

  // 砂の降る位置：端からの距離を偏らせて、真ん中は少なく端ほど多くする
  function sandX(){
    const d = Math.pow(Math.random(), SAND_EDGE) * W / 2;
    return Math.random() < 0.5 ? d : W - d;
  }

  // ---------- 描画 ----------
  function draw(){
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(backC, 0, 0);
    // 叩いた直後は壁（と縁のグラデーション・影）だけを震わせる。
    // ずれた分だけ画面の端から中の写真が見えないよう、震えの幅に合わせて少し大きく描く
    const k = shakeT / SHAKE_TIME;
    const sx = (Math.random() * 2 - 1) * SHAKE_AMP * k * dpr, sy = (Math.random() * 2 - 1) * SHAKE_AMP * k * dpr;
    const sc = 1 + 2 * SHAKE_AMP * k / Math.min(W, H);
    ctx.setTransform(sc, 0, 0, sc, cv.width / 2 * (1 - sc) + sx, cv.height / 2 * (1 - sc) + sy);
    ctx.drawImage(fadeC, 0, 0);   // 穴の中に落ちる壁の影
    ctx.drawImage(sideC, 0, 0);   // 壁の割れた断面
    ctx.drawImage(wallC, 0, 0);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    for (const f of frags){
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.a);
      ctx.scale(f.sc, f.sc);
      ctx.drawImage(f.c, f.ox, f.oy, f.w, f.h);
      ctx.restore();
    }
    ctx.globalAlpha = SAND_ALPHA;
    for (const s of sand){
      ctx.fillStyle = s.c;
      ctx.fillRect(s.x - s.r / 2, s.y - s.r / 2, s.r, s.r);
    }
    ctx.globalAlpha = 1;
  }
  function update(dt){
    // 震えている間、画面の上の端から砂を少しずつ降らせる
    if (shakeT > 0){
      sandDue += SAND_N * Math.min(dt, shakeT) / SHAKE_TIME;
      for (; sandDue >= 1; sandDue--){
        sand.push({
          x: sandX(), y: -rand(0, 10),
          vx: rand(-SAND_DRIFT, SAND_DRIFT), vy: rand(0, 80),
          r: rand(SAND_SIZE[0], SAND_SIZE[1]), c: COL.sand[Math.floor(Math.random() * COL.sand.length)],
        });
      }
    }
    shakeT = Math.max(0, shakeT - dt);
    for (let i = sand.length - 1; i >= 0; i--){
      const s = sand[i];
      s.vy = Math.min(SAND_MAX_V, s.vy + SAND_GRAVITY * dt);
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.y > H + 5) sand.splice(i, 1);
    }
    for (let i = frags.length - 1; i >= 0; i--){
      const f = frags[i];
      f.vy += GRAVITY * dt;
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.a += f.va * dt;
      f.sc += GROW * dt;
      // 画面の下へ出たら片付ける
      if (f.y - Math.hypot(f.w, f.h) * f.sc > H) frags.splice(i, 1);
    }
  }
  // 破片・砂が落ちている間と、壁が震えている間、カメラを使っている間だけ動かし続ける
  let running = false, last = 0;
  // カメラを使っている間は、毎回その時の映像で描き直す
  function loop(now){
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    update(dt);
    if (camOn(0)) renderSrc();
    if (camOn(1)) renderBack();
    draw();
    if (frags.length || sand.length || shakeT > 0 || cam.stream) requestAnimationFrame(loop);
    else running = false;
  }
  function requestDraw(){
    if (running) return;
    running = true;
    last = performance.now();
    requestAnimationFrame(loop);
  }

  // ---------- 入力 ----------
  const localPos = e => {
    const r = cv.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  };
  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    if (!imgs[0]) return;   // 壁の写真を読み込むまでは崩さない
    const { x, y } = localPos(e);
    hit(x, y);
  });

  // iPhone(Safari)で長押しにより文字選択・拡大鏡・メニューが出るのを防ぐ
  document.addEventListener('touchstart', e => { if (e.target === cv) e.preventDefault(); }, { passive:false });
  // 共有の文面だけは選んでコピーできるようにする
  document.addEventListener('selectstart', e => {
    const t = e.target.nodeType === 1 ? e.target : e.target.parentElement;
    if (t && t.closest('#share-text')) return;
    e.preventDefault();
  });
  document.addEventListener('contextmenu', e => { if (e.target === cv) e.preventDefault(); });

  // スマホでのダブルタップ拡大を防ぐ（拡大すると元に戻せなくなるため）
  // 写真選択ボタンは除外する（止めるとファイル選択が開かないことがある）
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    if (e.target instanceof Element && e.target.closest('.pick')) return;
    const now = Date.now();
    if (now - lastTouchEnd < 350) e.preventDefault();
    lastTouchEnd = now;
  }, { passive:false });

  // ---------- 写真の読み込み ----------
  // blob: のURLを<img>に渡す方式は、表示する環境によっては読み込みが禁止されていて全部失敗するので使わない。
  // まず createImageBitmap でファイルから直接作り、使えなければ data: URL で読む
  function loadImage(file){
    const viaDataUrl = () => new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => {
        const im = new Image();
        im.onload = () => resolve(im);
        im.onerror = reject;
        im.src = fr.result;
      };
      fr.onerror = reject;
      fr.readAsDataURL(file);
    });
    if (window.createImageBitmap) return createImageBitmap(file).catch(viaDataUrl);
    return viaDataUrl();
  }

  // 写真を入れる（壁の写真を変えたら、壁は崩れる前の姿に戻す）
  function setImage(i, im){
    if (imgs[i] && imgs[i].close) imgs[i].close();  // 前のImageBitmapのメモリを解放
    imgs[i] = im;
    if (cam.layer === i) setCamState(0);   // 写真を選んだら、その写真のカメラはやめて選んだ写真を使う
    if (i === 0) resetWall();
    else renderBack();
    requestDraw();
  }

  [0, 1].forEach(i => {
    const input = $('file' + i), text = $('pickText' + i), label = text.textContent;
    input.addEventListener('change', () => {
      const f = input.files && input.files[0];
      if (!f) return;
      loadImage(f).then(im => setImage(i, im)).catch(() => {
        text.textContent = 'この画像は読み込めません';
        setTimeout(() => { text.textContent = label; }, 1500);
      }).finally(() => { input.value = ''; });  // 空にするのは読み込みが終わってから
    });
  });

  // ---------- 最初から入れておく写真 ----------
  // 壁：壁の写真、中：人の顔の絵。写真を選ぶと置き換わる

    };
    im.src = src;
  });

  // ---------- 効果音 ----------
  // 音声ファイルは使わず Web Audio で合成する。最初の操作で鳴らせる状態にする
  const se = (() => {
    let ac = null, out = null, burst = null, on = true;
    const init = () => {
      if (ac) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      // 重なっても割れないよう軽く圧縮してから出す
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -18; comp.ratio.value = 4;
      out = ac.createGain();
      out.gain.value = SE_VOLUME;
      out.connect(comp).connect(ac.destination);
      // 砕ける音の元になるノイズ
      burst = ac.createBuffer(1, Math.round(ac.sampleRate * 0.6), ac.sampleRate);
      const d = burst.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    };
    const unlock = () => {
      init();
      if (ac && ac.state !== 'running') ac.resume();
    };
    ['pointerdown', 'touchend', 'keydown'].forEach(t => document.addEventListener(t, unlock, true));
    const ready = () => on && ac && ac.state === 'running';

    // 帯域を絞ったノイズ（type: 'bandpass' か 'lowpass'）
    function noise(type, freq, gain, len, delay = 0){
      const t = ac.currentTime + delay;
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = burst;
      f.type = type; f.frequency.value = freq; f.Q.value = type === 'bandpass' ? 2 : 0.7;
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0005, t + len);
      src.connect(f).connect(g).connect(out);
      src.start(t, Math.random() * 0.1); src.stop(t + len);
    }
    // 音程が下がる短い音（ドンという重さ）
    function thump(f0, f1, gain, len){
      const t = ac.currentTime;
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(f0, t);
      o.frequency.exponentialRampToValueAtTime(f1, t + len);
      g.gain.setValueAtTime(0.0005, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.005);
      g.gain.exponentialRampToValueAtTime(0.0005, t + len);
      o.connect(g).connect(out);
      o.start(t); o.stop(t + len);
    }

    return {
      setOn(v){ on = v; },
      // ひびが入る：ゴツッという鈍い音に、ピシッと割れる音を重ねる
      crack(){
        if (!ready()) return;
        thump(140, 60, 0.7, 0.14);
        noise('bandpass', 2600 + Math.random() * 800, 0.5, 0.05);
        noise('lowpass', 700, 0.35, 0.12);
      },
      // 崩れる：重いドンに、ガラガラと崩れる音と、破片がぱらぱら当たる音を続ける
      crumble(){
        if (!ready()) return;
        thump(110, 40, 0.9, 0.3);
        noise('lowpass', 1000, 0.8, 0.5);
        noise('bandpass', 2200, 0.4, 0.08);
        for (let i = 0; i < 7; i++) noise('bandpass', rand(1500, 3800), rand(0.15, 0.35), 0.04, rand(0.08, 0.5));
      },
    };
  })();

  // 効果音のオン・オフ（タッチは連打の拡大防止に止められないよう pointerdown で、キーボード操作は click で切り替える）
  const soundBtn = $('sound');
  const toggleSound = () => {
    const v = soundBtn.getAttribute('aria-pressed') !== 'true';
    soundBtn.setAttribute('aria-pressed', String(v));
    se.setOn(v);
  };
  soundBtn.addEventListener('pointerdown', e => { e.preventDefault(); toggleSound(); });
  soundBtn.addEventListener('click', e => { if (e.detail === 0) toggleSound(); });

  // ---------- 共有 ----------
  const shareText = () => '壁の中には...?\n' + location.href.split(/[?#]/)[0] + '\n#ジャイアントウォール';
  // 今の画面を画像にする
  function snapshotCanvas(){
    draw();
    const c = document.createElement('canvas');
    c.width = cv.width; c.height = cv.height;
    c.getContext('2d').drawImage(cv, 0, 0);
    return c;
  }
  // 画像をPNGのファイルにする（共有シートの制約があるため同期処理で作る）
  function imageFile(c){
    const bin = atob(c.toDataURL('image/png').split(',')[1]);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return new File([buf], 'giant-wall.png', { type: 'image/png' });
  }
  const shareBtn = $('share'), shareView = $('share-view');
  shareBtn.addEventListener('pointerdown', e => e.stopPropagation());
  shareBtn.addEventListener('click', () => {
    const text = shareText();
    const c = snapshotCanvas();
    const file = imageFile(c);
    // 3) 共有シートが無い・使えない環境: 文面をコピーし、共有される内容（画像と文面）を画面に出す
    const fallback = () => {
      navigator.clipboard?.writeText(text).catch(() => {});
      $('share-img').src = c.toDataURL('image/png');
      $('share-text').textContent = text;
      shareView.classList.remove('hidden');
      $('share-close').focus({ preventScroll:true });
    };
    // 共有シートが出なかったときは 3) へ：失敗した（埋め込み表示で共有が禁止されている等）とき、
    // またはキャンセル扱いでも押してすぐ（SHARE_INSTANT 秒未満）に終わったとき（シートを出せないアプリ内ブラウザ等）。
    // 共有シートを開いてから自分で閉じたキャンセルでは何もしない
    const shareStart = performance.now();
    const failed = err => {
      const instant = performance.now() - shareStart < SHARE_INSTANT * 1000;
      if (!err || err.name !== 'AbortError' || instant) fallback();
    };
    // 1) 画像を渡せる共有シート（スマホなど）: 文面＋画像
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      navigator.share({ text, files: [file] }).catch(failed);
      return;
    }
    // 2) 画像を渡せない共有シート: 文面のみ
    if (navigator.share){
      navigator.share({ text }).catch(failed);
      return;
    }
    fallback();
  });
  const closeShareView = () => {
    shareView.classList.add('hidden');
    shareBtn.focus({ preventScroll:true });
  };
  $('share-close').addEventListener('click', closeShareView);
  shareView.addEventListener('pointerdown', e => e.stopPropagation());
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !shareView.classList.contains('hidden')) closeShareView();
  });

  // ---------- カメラ ----------
  // ボタンを押すたびに「オフ → 壁の写真をカメラに → 中の写真をカメラに → オフ」と切り替える。
  // 壁は背面カメラ（目の前の景色）、中はインカメラ（自分）を使う。インカメラは鏡のように左右反転して映す
  const CAM_STATES = [
    { layer: -1, label: '',   name: 'オフ' },
    { layer: 0,  label: '壁', name: '壁の写真', facing: 'environment' },
    { layer: 1,  label: '中', name: '中の写真', facing: 'user' },
  ];
  const camBtn = $('cam'), camLabel = $('cam-label');

  function stopStream(){
    if (cam.stream) cam.stream.getTracks().forEach(t => t.stop());
    cam.stream = null;
    video.srcObject = null;
  }
  function showCamState(){
    const st = CAM_STATES[cam.state];
    camBtn.setAttribute('aria-pressed', String(cam.state !== 0));
    camBtn.setAttribute('aria-label', 'カメラ：' + st.name);
    camLabel.textContent = st.label;
  }
  // 写真を描き直す（カメラをやめた写真を、元の写真か残した映像に戻す）
  const refresh = layer => { if (layer === 0) renderSrc(); else if (layer === 1) renderBack(); };

  // カメラを使えなかったとき：オフに戻し、対象の写真のボタンに一時的に知らせる
  function camFailed(layer){
    const old = cam.layer;
    cam.state = 0; cam.layer = -1;
    stopStream();
    showCamState();
    refresh(old);
    requestDraw();
    const text = $('pickText' + layer), label = layer === 0 ? '壁の写真' : '中の写真';
    text.textContent = 'カメラを使えません';
    setTimeout(() => { text.textContent = label; }, 1500);
  }

  async function setCamState(n){
    const token = ++cam.token;  // 連打したときは最後の操作だけを生かす
    const prev = cam.layer, st = CAM_STATES[n];
    // カメラを切り替えたら、それまでカメラを映していた写真に、その時の映像を止めて残す
    if (prev >= 0 && prev !== st.layer) keepFrame(prev);
    cam.state = n; cam.layer = st.layer;
    stopStream();
    showCamState();
    refresh(prev);
    requestDraw();
    if (st.layer < 0) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ camFailed(st.layer); return; }  // https でないページなど
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: st.facing, width: { ideal: 1280 }, height: { ideal: 1280 } }, audio: false,
      });
      if (token !== cam.token){ stream.getTracks().forEach(t => t.stop()); return; }
      cam.stream = stream;
      // 実際に使えたカメラの向きで反転を決める（向きが分からない機器では、インカメラを頼んだときだけ反転）
      const facing = stream.getVideoTracks()[0]?.getSettings?.().facingMode;
      cam.mirror = facing ? facing === 'user' : st.facing === 'user';
      video.srcObject = stream;
      await video.play().catch(() => {});
      requestDraw();
    } catch (e){
      if (token === cam.token) camFailed(st.layer);
    }
  }

  // 今映っている映像を、その写真として残す
  // 壁は、壁の写真と同じ大きさの絵にする（穴やひびの位置は壁の写真の画素で持っているので、ずれないように）
  function keepFrame(layer){
    if (!cam.stream || video.readyState < 2 || !video.videoWidth) return;
    const c = document.createElement('canvas');
    if (layer === 0){
      const { w, h } = frontSize();
      c.width = Math.round(w); c.height = Math.round(h);
      coverInto(c.getContext('2d'), video, 0, 0, c.width, c.height, cam.mirror);
    } else {
      c.width = backC.width; c.height = backC.height;
      c.getContext('2d').drawImage(backC, 0, 0);
    }
    if (imgs[layer] && imgs[layer].close) imgs[layer].close();
    imgs[layer] = c;
  }

  // 初めてカメラボタンを押したときは、カメラを使うことを知らせる画面を出し、許可を押したらカメラを起動する
  // （このページを開いている間は、2回目からは出さない）
  let camAllowed = false;
  const camView = $('cam-view');
  const camViewOpen = () => !camView.classList.contains('hidden');
  function openCamView(){
    camView.classList.remove('hidden');
    $('cam-allow').focus({ preventScroll:true });
  }
  function closeCamView(){
    camView.classList.add('hidden');
    camBtn.focus({ preventScroll:true });
  }
  $('cam-close').addEventListener('click', closeCamView);
  $('cam-allow').addEventListener('click', () => {
    camAllowed = true;
    closeCamView();
    setCamState(1);
  });
  camView.addEventListener('pointerdown', e => e.stopPropagation());
  document.addEventListener('keydown', e => {
    if (camViewOpen() && e.key === 'Escape') closeCamView();
  });

  // 切り替え方は効果音ボタンと同じ（タッチは pointerdown、キーボード操作は click）
  const toggleCam = () => {
    if (!camAllowed){ openCamView(); return; }
    setCamState((cam.state + 1) % CAM_STATES.length);
  };
  camBtn.addEventListener('pointerdown', e => { e.preventDefault(); toggleCam(); });
  camBtn.addEventListener('click', e => { if (e.detail === 0) toggleCam(); });

  // 別のアプリから戻ったとき、止まった映像を再開する
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && cam.stream) video.play().catch(() => {});
  });

  // ---------- 開始 ----------
  resize();
  addEventListener('resize', resize);
})();
</script>
</body>
</html>
