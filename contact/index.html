  <meta charset="UTF-8">

  <title>お問い合わせ | トドネロのゲーム置き場</title>
  <meta name="description" content="トドネロのゲーム置き場へのお問い合わせ方法。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;600&family=Noto+Sans+JP:wght@400;600&display=swap" rel="stylesheet">
  <style>
    /*
     * 文章ページ(運営者情報・プライバシーポリシー、お問い合わせ)のスタイル。
     * トップページと同じ配色・書体にそろえ、common/css は読み込まずこのファイル内で完結させる。
     * 2ページとも同じ内容なので、変えるときは2ファイルそろえて直すこと。
     */
    :root {
      --color-just-black: #0e100f;
      --color-surface-cream: #fffce1;
      --color-surface-50: #7c7c6f;
      --color-surface-25: #42433d;
      --color-light-green: #abff84;
      --font-sans: "Inter Tight", "Noto Sans JP", ui-sans-serif, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      background: var(--color-just-black);
      color: var(--color-surface-cream);
      font-family: var(--font-sans);
      font-size: 17px;
      line-height: 1.7;
      letter-spacing: -0.01em;
    }
    a { color: var(--color-light-green); }
    .site { display: inline-block; margin-bottom: 40px; color: inherit; text-decoration: none; font-size: 16px; font-weight: 600; }
    main { max-width: 760px; margin: 0 auto; padding: clamp(40px, 8vh, 80px) 24px; }
    h1 { margin: 0 0 32px; font-size: clamp(34px, 7vw, 44px); font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; }
    h2 { margin: 48px 0 12px; font-size: 23px; font-weight: 600; line-height: 1.38; }
    h3 { margin: 32px 0 8px; font-size: 19px; font-weight: 600; line-height: 1.38; }
    p, ul, dl { margin: 0 0 16px; }
    ul { padding-left: 1.4em; }
    dt { color: var(--color-surface-50); font-size: 14px; }
    dd { margin: 0 0 16px; }
    .note { color: var(--color-surface-50); font-size: 14px; }
    footer { max-width: 760px; margin: 0 auto; padding: 24px 24px 48px; border-top: 1px solid var(--color-surface-25); font-size: 14px; color: var(--color-surface-50); }
    footer nav { display: flex; flex-wrap: wrap; gap: 8px 24px; }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover, footer a:focus-visible { color: var(--color-surface-cream); }
  </style>
</head>
<body>
  <main>
    <a class="site" href="../index.html">トドネロのゲーム置き場</a>
    <h1>お問い合わせ</h1>
    <p>当サイトへのお問い合わせと不具合の報告は、X のダイレクトメッセージで受け付けています。</p>
    <p><a href="https://x.com/x282665" rel="noopener">X: @x282665</a></p>

    <h2>不具合を報告するとき</h2>
    <p>次のことを書いていただけると、原因を調べやすくなります。</p>
    <ul>
      <li>ゲームの名前</li>
      <li>使っている端末とブラウザ(例: iPhone の Safari、Windows の Chrome)</li>
      <li>何をしたときに、どうなったか</li>
    </ul>

    <p class="note">お返事には時間がかかることや、内容によってはお返事できないことがあります。</p>
  </main>
  <footer>
    <nav>
      <a href="../index.html">トップ</a>
      <a href="../privacy/index.html">運営者情報・プライバシーポリシー</a>
      <a href="index.html">お問い合わせ</a>
    </nav>
  </footer>
</body>
</html>
